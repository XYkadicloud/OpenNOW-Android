name: android-build

on:
  workflow_dispatch:
  push:
    branches:
      - android-native
      - main

permissions:
  contents: read

jobs:
  build:
    name: build-debug-apk
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK at: $SDK"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          echo "sdk.dir=$SDK" > local.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon --no-configuration-cache assembleDebug

      - name: Collect APK
        run: |
          mkdir -p ../out
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} ../out/ \;
          ls -la ../out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennow-debug-apk
          path: out/*.apk
          if-no-files-found: error
